name: Path rules

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run path rule tests
        run: make test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install BPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm linux-tools-common linux-tools-generic libbpf-dev libelf-dev zlib1g-dev
      - name: Build monitors
        run: |
          BPFTOOL_BIN=$(find /usr/lib/linux-tools -type f -name bpftool -print -quit)
          test -n "$BPFTOOL_BIN"
          make BPFTOOL="$BPFTOOL_BIN"
